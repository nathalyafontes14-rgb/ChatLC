<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edu | LC Construção e Reforma </title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e1da;--card:#f6f4ef;--ink:#26282a;--mute:#6b6e70;--line:#d3cfc6;--bot:#ffffff;--me:#26282a;--meink:#f6f4ef;--hi:#f2b705;--hiink:#26282a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--ink:#ecebe7;--mute:#9a9d9f;--line:#34373a;--bot:#2e3134;--me:#f2b705;--meink:#26282a}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--ink:#ecebe7;--mute:#9a9d9f;--line:#34373a;--bot:#2e3134;--me:#f2b705;--meink:#26282a}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,Arial,sans-serif;font-size:16px;display:flex;justify-content:center;padding:0 12px}
.chat{width:100%;max-width:640px;height:100%;max-height:900px;margin:auto;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;border-radius:6px;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#26282a;color:#f6f4ef;border-bottom:6px solid var(--hi)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--hi);display:grid;place-items:center;font-size:24px;flex:none}
header h1{font:700 24px/1 "Barlow Condensed",Arial Narrow,sans-serif;letter-spacing:.02em;margin:0}
header p{margin:3px 0 0;font-size:13px;color:#b9bbbc}
.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5cc47a;margin-right:6px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:84%;padding:10px 13px;border-radius:4px 14px 14px 14px;background:var(--bot);border:1px solid var(--line);white-space:pre-wrap;line-height:1.45;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me);color:var(--meink);border-color:transparent;border-radius:14px 4px 14px 14px}
.typing{display:flex;gap:4px;padding:14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.quick button{font:500 14px Barlow,sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer}
.quick button:hover{background:var(--hi);border-color:var(--hi);color:var(--hiink)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bot);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px}
input:focus,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
form button{font:600 15px Barlow,sans-serif;background:var(--hi);color:var(--hiink);border:0;border-radius:6px;padding:0 18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.6}}
@media (max-width:480px){body{padding:0}.chat{border-radius:0;border-left:0;border-right:0;max-height:none}}
</style>
</head>
<body>
<main class="chat">
  <header>
    <div class="avatar" aria-hidden="true">👷</div>
    <div><h1>Edu</h1><p><span class="on"></span>Assistente virtual da LC Construção e Reforma </p></div>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form id="f" autocomplete="off">
    <input id="t" type="text" placeholder="Digite sua mensagem" aria-label="Mensagem">
    <button type="submit">Enviar</button>
  </form>
</main>
<script>
// ===== EDITE AQUI: dados da empresa (valores de exemplo) =====
const CONFIG = {
  empresa: "LC Construção e Reforma",
  telefone: "(14) 99845-4184",
  whatsapp: "(14) 99845-4184",
  email: "contato@lc.construcaoereforma35@gmail.com",
  horario: "Segunda a sexta, das 8h às 18h. Sábado, das 8h às 16h.",
  servicos: ["Construção de casas e sobrados", "Muros e calçadas", "Reformas e ampliações", "Acabamento em pisos, janelas e portas", "Obras comerciais"],
  prazo: "O prazo depende do tamanho e do tipo da obra. Uma reforma pequena costuma levar semanas; uma casa nova, vários meses. Depois da visita técnica, você recebe um cronograma por escrito.",
  pagamento: "O pagamento pode ser dividido em etapas, de acordo com o andamento da obra. As condições são combinadas no orçamento.",
  orçamento: "gratuito"
};
// =============================================================
const log = document.getElementById("log"), quick = document.getElementById("quick"),
      form = document.getElementById("f"), input = document.getElementById("t");
let flow = null, lead = {};

const MENU = ["Serviços", "Pedir orçamento", "Prazos", "Pagamento", "Horário", "Contato"];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
const has = (s, words) => words.some(w => s.includes(w));

function add(text, me) {
  const d = document.createElement("div");
  d.className = "m" + (me ? " me" : "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function setQuick(opts) {
  quick.textContent = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = o;
    b.onclick = () => send(o);
    quick.appendChild(b);
  });
}
function botSay(text, opts) {
  setQuick([]);
  const t = document.createElement("div");
  t.className = "m typing"; t.innerHTML = "<i></i><i></i><i></i>";
  log.appendChild(t); log.scrollTop = log.scrollHeight;
  setTimeout(() => { t.remove(); add(text); setQuick(opts || MENU); }, 550);
}

function startQuote() { flow = "nome"; lead = {}; botSay("Vamos montar seu pedido de orçamento. Qual é o seu nome?", []); }

function handleFlow(raw) {
  if (has(norm(raw), ["cancelar", "sair", "voltar"])) { flow = null; return botSay("Pedido cancelado. Posso ajudar em mais alguma coisa?"); }
  if (flow === "nome") { lead.nome = raw; flow = "tipo"; return botSay("Prazer, " + raw + "! Que tipo de obra você quer fazer?", ["Casa nova", "Reforma", "Ampliação", "Obra comercial"]); }
  if (flow === "tipo") { lead.tipo = raw; flow = "cidade"; return botSay("Em qual cidade fica o terreno ou o imóvel?", []); }
  if (flow === "cidade") { lead.cidade = raw; flow = "contato"; return botSay("Qual telefone ou WhatsApp podemos usar para falar com você?", []); }
  if (flow === "contato") {
    lead.contato = raw; flow = null;
    return botSay("Pedido anotado:\n• Nome: " + lead.nome + "\n• Obra: " + lead.tipo + "\n• Cidade: " + lead.cidade + "\n• Contato: " + lead.contato +
      "\n\nPara enviar à equipe, mande esses dados pelo WhatsApp " + CONFIG.whatsapp + " ou pelo e-mail " + CONFIG.email + ". Nossa equipe agenda a visita técnica e envia o orçamento.");
  }
}

function reply(raw) {
  const s = norm(raw);
  if (has(s, ["orcamento", "cotacao", "preco", "quanto custa", "valor"])) return startQuote();
  if (has(s, ["servico", "fazem", "fazer", "trabalham", "o que voces"]))
    return botSay("A " + CONFIG.empresa + " atua com:\n• " + CONFIG.servicos.join("\n• ") + "\n\nQuer pedir um orçamento?", ["Pedir orçamento", "Prazos", "Contato"]);
  if (has(s, ["prazo", "demora", "quanto tempo", "tempo de obra"])) return botSay(CONFIG.prazo, ["Pedir orçamento", "Pagamento"]);
  if (has(s, ["pagamento", "pagar", "parcela", "financ", "entrada", "cartao", "pix"])) return botSay(CONFIG.pagamento, ["Pedir orçamento", "Prazos"]);
  if (has(s, ["horario", "aberto", "funciona", "atendimento", "expediente"])) return botSay("Atendemos: " + CONFIG.horario);
  if (has(s, ["endereco", "onde fica", "localizacao", "escritorio", "visita"])) return botSay("Nosso escritório: " + CONFIG.endereco + "\nPara visita técnica na sua obra, peça um orçamento.", ["Pedir orçamento", "Horário"]);
  if (has(s, ["contato", "telefone", "whatsapp", "zap", "email", "e-mail", "falar com", "atendente", "humano", "pessoa"]))
    return botSay("Fale com a nossa equipe:\n• Telefone: " + CONFIG.telefone + "\n• WhatsApp: " + CONFIG.whatsapp + "\n• E-mail: " + CONFIG.email + "\n• Horário: " + CONFIG.horario);
  if (has(s, ["obrigad", "valeu", "agradec"])) return botSay("De nada! Se precisar de mais alguma coisa, é só chamar.");
  if (has(s, ["tchau", "ate mais", "ate logo"])) return botSay("Até mais! A " + CONFIG.empresa + " agradece o contato.", []);
  if (has(s, ["oi", "ola", "bom dia", "boa tarde", "boa noite", "e ai"]) && s.length < 25) return botSay("Olá! Sou o Edu. Como posso ajudar?");
  botSay("Não entendi bem essa pergunta. Posso ajudar com serviços, orçamento, prazos, pagamento, horário e contato. Se preferir, fale direto com a equipe pelo WhatsApp " + CONFIG.whatsapp + ".");
}

function send(text) {
  const v = text.trim(); if (!v) return;
  add(v, true); input.value = "";
  flow ? handleFlow(v) : reply(v);
}
form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });

botSay("Olá! Sou o Edu, assistente virtual da " + CONFIG.empresa + ".\nComo posso te ajudar hoje?");
</script>
</body>
</html>
